[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poltergeist"
version = "0.1.0"
description = "An AI-powered haunted terminal. Run `haunt` — your shell is possessed by a local, open-weight ghost (Ollama + Gemma). Nothing leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "The Poltergeist Authors" }]
keywords = ["cli", "terminal", "halloween", "ollama", "gemma", "haunted", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.0",
  "prompt_toolkit>=3.0",
  "rich>=13.8",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/abbasmir12/poltergeist"
Issues = "https://github.com/abbasmir12/poltergeist/issues"

[project.scripts]
haunt = "poltergeist.cli:main"
poltergeist = "poltergeist.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/poltergeist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP041"] # mention when relevant
